name: tienda-api

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_HOST: db
      MONGO_USER: root
      MONGO_PASSWORD: example
      MONGO_PORT: "27017"
      MONGO_DB: tienda
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "root",
          "--password",
          "example",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mongo-data:
