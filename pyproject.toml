[project]
name = "tienda-api"
version = "0.1.0"
description = "API de la tienda, construida capa por capa"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "pyjwt[crypto]>=2.15.1",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
